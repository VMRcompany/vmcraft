name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack site
        run: |
          mkdir -p dist
          cp -a index.html versions.html 404.html CNAME .nojekyll css js images dist/
      - name: Mirror launcher APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync-apks.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
